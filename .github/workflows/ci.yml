name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check . --output-format=github

      - name: Type check (mypy)
        run: mypy app/ --ignore-missing-imports --no-error-summary
        continue-on-error: true

      - name: Security scan (bandit)
        run: |
          pip install bandit[toml] --quiet
          bandit -r app/ -ll -x app/tests --format json -o bandit-report.json || true
          # Fail only on HIGH severity issues
          bandit -r app/ -lll -x app/tests --quiet
        continue-on-error: true

      - name: Install Playwright + Chromium
        run: |
          pip install playwright --quiet
          playwright install chromium --with-deps

      - name: Run tests (unit + integration)
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          SECRET_KEY: "ci-test-secret-key-not-for-prod"
          ENVIRONMENT: "test"
          ANTHROPIC_API_KEY: ""
          PLAYWRIGHT_BROWSERS_PATH: "${HOME}/.cache/ms-playwright"
        run: |
          pytest tests/ -v --tb=short \
            --cov=app --cov-report=term-missing \
            --cov-fail-under=60

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/.coverage
          retention-days: 7

  frontend:
    name: Frontend lint & type check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx next lint --max-warnings 0
        continue-on-error: true

      - name: Production build
        env:
          NEXT_PUBLIC_API_URL: https://api-production-fd73.up.railway.app
        run: npm run build
