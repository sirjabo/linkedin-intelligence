# Dev overrides: volumes + hot reload
services:
  api:
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DEBUG: "true"

  worker:
    volumes:
      - ./backend:/app
    command: celery -A app.worker worker --loglevel=info --concurrency=2

  beat:
    volumes:
      - ./backend:/app
