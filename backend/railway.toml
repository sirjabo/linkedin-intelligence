[build]
builder = "dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
startCommand = "sh -c 'alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}'"

# Celery worker (separate Railway service, same backend/ root):
#   startCommand = "celery -A app.worker.celery_app worker --loglevel=info --concurrency=4"
# Celery beat (separate Railway service):
#   startCommand = "celery -A app.worker.celery_app beat --loglevel=info"
